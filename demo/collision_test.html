<!DOCTYPE html>
<html>
<head>
    <title>Collision System Demo</title>
    <style>
        canvas {
            border: 1px solid black;
        }
        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-family: monospace;
        }
        button {
            display: block;
            margin: 5px 0;
            padding: 5px;
            width: 200px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controls">
        <h3>Test Scenarios:</h3>
        <button onclick="setScenario(0)">Corner to Face</button>
        <button onclick="setScenario(1)">Face to Face (Size Difference)</button>
        <button onclick="setScenario(2)">Rotated Collision (15°)</button>
        <button onclick="setScenario(3)">Acute Angle Collision</button>
        <button onclick="resetScene()">Reset Current Scene</button>
        <div id="stats"></div>
    </div>

    <script type="module">
        import { Vector3, Quaternion, CollisionBody, CollisionSystem } from './physics_demo.js';

        // WebGL setup with fallback
        const canvas = document.getElementById('canvas');
        let gl = null;
        
        try {
            // Try WebGL2 first
            gl = canvas.getContext('webgl2', { 
                antialias: true,
                powerPreference: 'high-performance'
            });
            
            if (!gl) {
                // Fallback to WebGL1
                gl = canvas.getContext('webgl', { 
                    antialias: true,
                    powerPreference: 'high-performance'
                });
            }
            
            if (!gl) {
                throw new Error('WebGL not supported');
            }
        } catch (e) {
            document.body.innerHTML = `
                <div style="color: red; padding: 20px;">
                    Error: ${e.message}<br>
                    Please try a different browser or enable hardware acceleration.
                </div>
            `;
            throw e;
        }
        
        // Resize canvas to fill window
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        // Shader setup
        const vertexShader = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(vertexShader, `#version 300 es
            uniform mat4 uProjection;
            uniform mat4 uView;
            uniform mat4 uModel;
            uniform vec3 uColor;
            
            layout(location = 0) in vec3 position;
            
            out vec3 vColor;
            
            void main() {
                gl_Position = uProjection * uView * uModel * vec4(position, 1.0);
                vColor = uColor;
            }
        `);
        gl.compileShader(vertexShader);

        const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(fragmentShader, `#version 300 es
            precision highp float;
            
            in vec3 vColor;
            out vec4 fragColor;
            
            void main() {
                fragColor = vec4(vColor, 1.0);
            }
        `);
        gl.compileShader(fragmentShader);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        // Create cube vertices and indices
        const vertices = new Float32Array([
            // Front face
            -0.5, -0.5,  0.5,
             0.5, -0.5,  0.5,
             0.5,  0.5,  0.5,
            -0.5,  0.5,  0.5,
            // Back face
            -0.5, -0.5, -0.5,
             0.5, -0.5, -0.5,
             0.5,  0.5, -0.5,
            -0.5,  0.5, -0.5,
        ]);

        const indices = new Uint16Array([
            0, 1, 2,    0, 2, 3,    // Front
            1, 5, 6,    1, 6, 2,    // Right
            5, 4, 7,    5, 7, 6,    // Back
            4, 0, 3,    4, 3, 7,    // Left
            3, 2, 6,    3, 6, 7,    // Top
            4, 5, 1,    4, 1, 0,    // Bottom
        ]);

        // Create buffers
        const vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

        const ibo = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

        // Get uniform locations
        const uProjection = gl.getUniformLocation(program, 'uProjection');
        const uView = gl.getUniformLocation(program, 'uView');
        const uModel = gl.getUniformLocation(program, 'uModel');
        const uColor = gl.getUniformLocation(program, 'uColor');

        // Camera setup
        const projection = mat4.perspective(mat4.create(), 45 * Math.PI / 180, canvas.width / canvas.height, 0.1, 100.0);
        const view = mat4.lookAt(mat4.create(), [0, 5, 10], [0, 0, 0], [0, 1, 0]);

        // Physics setup
        const physics = new CollisionSystem();
        let bodies = [];

        // Test scenarios
        const scenarios = [
            // Corner to Face
            () => {
                const body1 = new CollisionBody(
                    new Vector3(-2, 0, 0),
                    new Vector3(1, 1, 1)
                );
                body1.velocity = new Vector3(2, 0, 0);

                const body2 = new CollisionBody(
                    new Vector3(2, 0, 0),
                    new Vector3(2, 2, 2),
                    { isStatic: true }
                );

                return [body1, body2];
            },
            
            // Face to Face (Size Difference)
            () => {
                const body1 = new CollisionBody(
                    new Vector3(-2, 0, 0),
                    new Vector3(1, 1, 1)
                );
                body1.velocity = new Vector3(2, 0, 0);

                const body2 = new CollisionBody(
                    new Vector3(2, 0, 0),
                    new Vector3(3, 3, 1),
                    { isStatic: true }
                );

                return [body1, body2];
            },
            
            // Rotated Collision (15°)
            () => {
                const body1 = new CollisionBody(
                    new Vector3(-2, 0, 0),
                    new Vector3(1, 1, 1),
                    { rotation: Quaternion.fromEuler(0, Math.PI / 12, 0) }
                );
                body1.velocity = new Vector3(2, 0, 0);

                const body2 = new CollisionBody(
                    new Vector3(2, 0, 0),
                    new Vector3(2, 2, 2),
                    { isStatic: true }
                );

                return [body1, body2];
            },
            
            // Acute Angle Collision
            () => {
                const body1 = new CollisionBody(
                    new Vector3(-2, 0, -2),
                    new Vector3(1, 1, 1)
                );
                body1.velocity = new Vector3(2, 0, 2);

                const body2 = new CollisionBody(
                    new Vector3(2, 0, 2),
                    new Vector3(2, 2, 2),
                    { isStatic: true }
                );

                return [body1, body2];
            }
        ];

        let currentScenario = 0;

        // Set up initial scene
        function setScenario(index) {
            currentScenario = index;
            resetScene();
        }

        function resetScene() {
            // Clear existing bodies
            bodies.forEach(body => physics.removeBody(body));
            bodies = scenarios[currentScenario]();
            bodies.forEach(body => physics.addBody(body));
        }

        window.setScenario = setScenario;
        window.resetScene = resetScene;
        resetScene();

        // Render loop
        function render() {
            // Update physics
            physics.update(1/60);

            // Clear screen
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);

            // Update uniforms
            gl.uniformMatrix4fv(uProjection, false, projection);
            gl.uniformMatrix4fv(uView, false, view);

            // Draw bodies
            bodies.forEach((body, i) => {
                const model = mat4.create();
                mat4.translate(model, model, [body.position.x, body.position.y, body.position.z]);
                
                // Apply rotation from quaternion
                const rotMat = mat4.fromQuat(mat4.create(), [
                    body.rotation.x,
                    body.rotation.y,
                    body.rotation.z,
                    body.rotation.w
                ]);
                mat4.multiply(model, model, rotMat);
                
                // Apply scale
                mat4.scale(model, model, [body.size.x, body.size.y, body.size.z]);

                gl.uniformMatrix4fv(uModel, false, model);
                gl.uniform3f(uColor, i === 0 ? 1 : 0, i === 1 ? 1 : 0, 0);

                gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
            });

            // Update stats
            document.getElementById('stats').textContent = 
                `Bodies: ${bodies.length}\n` +
                `Body 1 Pos: ${bodies[0].position.toString()}\n` +
                `Body 1 Vel: ${bodies[0].velocity.toString()}`;

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
